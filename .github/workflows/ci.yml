# Controllo dei tipi → validazione del catalogo delle Letture → build → test → deploy su Pages (ADR-0006, ADR-0003).
# Il deploy parte solo da un push su main, e solo se tutti i job prima sono passati.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Tipi, catalogo e test unitari
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: npm run check
      # Il registro delle Letture si confronta con quello di prima: la base della PR, o il commit prima del push.
      - name: Validazione del catalogo delle Letture
        env:
          PRECEDENTE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
        run: |
          git fetch --depth=1 origin "$PRECEDENTE"
          npm run valida:letture -- FETCH_HEAD
      # ADR-0008: al massimo 1 MB di campioni del pianoforte per Lettura e 10 MB in tutto.
      - name: Campioni audio delle Letture
        run: npm run controlla:campioni
      - run: npm run test:unit

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with: { name: sito, path: dist/, if-no-files-found: error, retention-days: 7 }
      # Il sito con il catalogo d'esempio delle Letture, solo per gli e2e (ticket #32): non si pubblica mai.
      - run: npm run build:esempio
      - uses: actions/upload-artifact@v7
        with: { name: sito-esempio, path: dist-esempio/, if-no-files-found: error, retention-days: 7 }

  e2e:
    name: Playwright (${{ matrix.motore }})
    needs: build
    runs-on: ubuntu-latest
    container:
      # Stessa versione di @playwright/test in package.json: si aggiornano insieme, poi si rigenerano le baseline.
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        motore: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - uses: actions/download-artifact@v8
        with: { name: sito, path: dist/ }
      - uses: actions/download-artifact@v8
        with: { name: sito-esempio, path: dist-esempio/ }
      - run: npx playwright test --project="*-${{ matrix.motore }}"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.motore }}
          path: playwright-report/
          retention-days: 14

  # Ticket #34: per ogni Lettura nuova o modificata nella PR uno screenshot a 360 px con la Soluzione visibile.
  # Qui il token è in sola lettura (anche per le PR da fork): il commento sulla PR lo scrive commenta-anteprime.yml.
  anteprime:
    name: Anteprime delle Letture
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      # Il checkout di una PR è il merge con la base: HEAD^1 è la base, e il confronto mostra solo la PR.
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - run: npm ci
      - id: toccate
        run: |
          {
            echo 'letture<<FINE'
            npm run -s letture-toccate -- HEAD^1
            echo FINE
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: steps.toccate.outputs.letture != ''
        with: { name: sito, path: dist/ }
      - if: steps.toccate.outputs.letture != ''
        env:
          ANTEPRIMA_LETTURE: ${{ steps.toccate.outputs.letture }}
        run: npx playwright test --config playwright.anteprima.config.ts
      - if: steps.toccate.outputs.letture != ''
        uses: actions/upload-artifact@v7
        with: { name: anteprime, path: anteprime/, if-no-files-found: error, retention-days: 30 }
      # Il numero della PR e l'elenco, per commenta-anteprime.yml: sulle PR da fork workflow_run non li dà.
      - if: steps.toccate.outputs.letture != ''
        env:
          LETTURE: ${{ steps.toccate.outputs.letture }}
          PR: ${{ github.event.pull_request.number }}
        run: mkdir -p pr && echo "$PR" > pr/numero && printf '%s\n' "$LETTURE" > pr/letture
      - if: steps.toccate.outputs.letture != ''
        uses: actions/upload-artifact@v7
        with: { name: anteprime-pr, path: pr/, if-no-files-found: error, retention-days: 30 }

  deploy:
    name: Deploy su Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, build, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with: { name: sito, path: dist/ }
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist/ }
      - id: deployment
        uses: actions/deploy-pages@v5
